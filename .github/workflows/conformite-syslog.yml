# Banc de conformité syslog (issue #30) : la sortie `syslog` contre un vrai
# récepteur — Vector (sources `syslog` TCP et UDP), en conteneur éphémère.
# Les messages poussés (TCP octet-counting, TCP LF, UDP, RFC 5424/3164)
# sont relus dans les journaux du conteneur (sink `console`) :
# `tests/test_integration_syslog.py`. Complète les tests unitaires
# (faux transport).
#
# Runner hébergé GitHub (ubuntu-latest, autorisé par la MISSION) : Docker
# y est garanti, contrairement aux runners maison.
name: Banc de conformité syslog

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformite:
    name: "Sortie syslog contre un vrai récepteur (Vector)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Installation de Python
        run: uv python install

      - name: Installation des dépendances
        run: uv sync --extra dev

      - name: Vector éphémère
        run: |
          cat > /tmp/vector.yaml <<'YAML'
          api:
            enabled: true
            address: 0.0.0.0:8686
          sources:
            entree_tcp:
              type: syslog
              address: 0.0.0.0:5140
              mode: tcp
            entree_udp:
              type: syslog
              address: 0.0.0.0:5141
              mode: udp
          sinks:
            console:
              type: console
              inputs: [entree_tcp, entree_udp]
              encoding:
                codec: json
          YAML
          docker run -d --name vector -p 5140:5140 -p 5141:5141/udp -p 8686:8686 \
            -v /tmp/vector.yaml:/etc/vector/vector.yaml:ro \
            timberio/vector:0.59.0-debian --config /etc/vector/vector.yaml
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8686/health || true)
            if [ "$code" = "200" ]; then
              echo "Vector prêt"; exit 0
            fi
            sleep 1
          done
          docker logs vector
          echo "::error::Vector n'a pas démarré" && exit 1

      - name: Banc de conformité
        env:
          PYSTASHTEMPLATE_SYSLOG_HOST: localhost
          PYSTASHTEMPLATE_SYSLOG_TCP_PORT: "5140"
          PYSTASHTEMPLATE_SYSLOG_UDP_PORT: "5141"
          PYSTASHTEMPLATE_VECTOR_CONTAINER: vector
        run: uv run pytest tests/test_integration_syslog.py -v

      - name: Nettoyage du conteneur
        if: always()
        run: docker rm -f vector || true
