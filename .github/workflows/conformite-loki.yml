# Banc de conformité Loki (issue #21) : la sortie `loki` contre un vrai
# Grafana Loki en conteneur éphémère, push JSON vers `/loki/api/v1/push`,
# relecture par l'API LogQL (`query_range`). Complète les tests
# unitaires (faux serveur `httpx.MockTransport`) et la fixture du banc
# commun (#9).
#
# Runner hébergé GitHub (ubuntu-latest, autorisé par la MISSION) : Docker
# y est garanti, contrairement aux runners maison.
name: Banc de conformité Loki

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformite:
    name: "Sortie loki contre un vrai Loki"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Installation de Python
        run: uv python install

      - name: Installation des dépendances
        run: uv sync --extra dev

      - name: Loki éphémère
        run: |
          docker run -d --name loki -p 3100:3100 grafana/loki:3.7.9
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3100/ready >/dev/null; then echo "Loki prêt"; exit 0; fi
            sleep 1
          done
          docker logs loki
          echo "::error::Loki n'a pas démarré" && exit 1

      - name: Banc de conformité
        env:
          PYSTASHTEMPLATE_LOKI_URL: http://localhost:3100
        run: uv run pytest tests/test_integration_loki.py -v

      - name: Nettoyage du conteneur
        if: always()
        run: docker rm -f loki || true
