[project]
name = "pystashtemplate"
version = "0.2.0"
description = "Sémantique Logstash partagée : gabarits, filtres, interprétation des .conf (extrait de RsysLogstach, #111)"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7",
    "aiohttp>=3.14",  # transport HTTP asynchrone des sorties (#5)
    "geoip2",
    "maxminddb",
    "pyyaml",
    "logstash-pipeline-parser==0.0.3",
    "mmh3",
    "ua-parser==1.0.2",
    "ua-parser-builtins==202610",
    "lxml==6.1.3",
    "dnspython==2.9.1",
    "httpx>=0.28",
    "aiokafka>=0.12",  # producteur asynchrone de la sortie kafka (#29)
    "redis>=6.0",  # client asynchrone de la sortie redis (#33)
    "aio-pika>=9.5",  # client AMQP 0-9-1 de la sortie rabbitmq (#33)
    "nats-py>=2.10",  # client NATS / JetStream de la sortie nats (#33)
    "msgpack>=1.0",  # protocole forward de la sortie fluent_forward (#31)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "cryptography>=43",  # certificats de test TLS/mTLS (#5)
    "pytest-cov>=7.1.0",  # couverture lignes + branches, seuil bloquant
    "mmdb-writer>=0.2.7",  # bases .mmdb réelles générées par les tests
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/pystashtemplate"]
sources = ["src"]

[tool.hatch.build.targets.wheel.shared-data]
# Catalogues compilés installés dans <prefix>/share/locale/<locale>/LC_MESSAGES/pystashtemplate.mo
"lang/locale" = "share/locale"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/pystashtemplate"]

[tool.coverage.report]
fail_under = 95
show_missing = true
